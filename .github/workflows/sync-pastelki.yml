# Pulls newer approved illustrations from Pastelki (https://pastelki.marchew.work) into the app.
# Runs daily, on demand and on a `pastelki-updated` event (`studio sync-art --dispatch`); commits to master only when something changed and every check passes.
# The pictures reach players with the next store build (see README, "Illustrations from Pastelki").
name: Sync illustrations from Pastelki

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pastelki-updated]

permissions:
  contents: write

concurrency:
  group: sync-pastelki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        id: sync
        run: |
          npm run --silent sync-art | tee sync.log
          if git diff --quiet -- pastelki.lock.json src/art/library; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check
        if: steps.sync.outputs.changed == 'true'
        run: npm run check
      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "pastelki-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pastelki.lock.json src/art/library
          git commit -m "Sync illustrations from Pastelki" -m "$(head -1 sync.log)"
          git push
